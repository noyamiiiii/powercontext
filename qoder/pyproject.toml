[project]
name = "studyloop"
version = "0.1.0"
description = "A study coach that carries learning context across sessions with PowerContext."
readme = "README.md"
requires-python = ">=3.11,<4"
dependencies = [
  "powercontext[builtin,server]==1.2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
  "ruff>=0.15,<1",
]

[project.scripts]
studyloop = "studyloop.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studyloop"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["ASYNC", "B", "E", "F", "I", "RUF", "S", "SIM", "UP"]

[tool.ruff.lint.per-file-ignores]
"studyloop/**" = ["RUF001"]
"tests/**" = ["RUF001", "S101"]
