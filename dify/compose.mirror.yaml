services:
  api:
    image: docker.m.daocloud.io/langgenius/dify-api:1.9.2
  museum:
    build:
      args:
        PYTHON_IMAGE: docker.m.daocloud.io/library/python:3.12-slim
      context: ./backend
  nginx:
    image: docker.m.daocloud.io/library/nginx:1.27-alpine
  ollama:
    image: docker.m.daocloud.io/ollama/ollama:0.12.6
  postgres:
    image: docker.m.daocloud.io/library/postgres:15-alpine
  redis:
    image: docker.m.daocloud.io/library/redis:7-alpine
  sandbox:
    image: docker.m.daocloud.io/langgenius/dify-sandbox:0.2.12
  web:
    image: docker.m.daocloud.io/langgenius/dify-web:1.9.2
  worker:
    image: docker.m.daocloud.io/langgenius/dify-api:1.9.2
