server {
 listen 80;
 client_max_body_size 10m;
 location ~ ^/(console/api|api|v1|files)/ { proxy_pass http://api:5001; proxy_read_timeout 360s; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for; }
 location / { proxy_pass http://web:3000; proxy_set_header Host $host; }
}
