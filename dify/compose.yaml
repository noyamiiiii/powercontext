name: midnight-dify
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: dify
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
    - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U postgres -d dify
      interval: 3s
      timeout: 3s
      retries: 40
  redis:
    image: redis:7-alpine
    command:
    - redis-server
    - --requirepass
    - ${REDIS_PASSWORD}
    volumes:
    - redis-data:/data
  api:
    image: langgenius/dify-api:1.9.2
    environment:
      SECRET_KEY: ${DIFY_SECRET_KEY:?run bootstrap}
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?run bootstrap}
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run bootstrap}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_BACKEND: redis
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: storage
      VECTOR_STORE: weaviate
      CHECK_UPDATE_URL: ''
      CONSOLE_WEB_URL: http://localhost:18080
      CONSOLE_API_URL: http://localhost:18080
      APP_WEB_URL: http://localhost:18080
      APP_API_URL: http://localhost:18080
      SERVICE_API_URL: http://localhost:18080
      FILES_URL: http://localhost:18080
      INTERNAL_FILES_URL: http://api:5001
      EDITION: SELF_HOSTED
      DEPLOY_ENV: PRODUCTION
      SERVER_WORKER_AMOUNT: '1'
      SERVER_WORKER_CONNECTIONS: '30'
      CELERY_WORKER_AMOUNT: '1'
      SQLALCHEMY_POOL_SIZE: '5'
      SQLALCHEMY_MAX_OVERFLOW: '5'
      LOG_LEVEL: INFO
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CODE_EXECUTION_API_KEY: ${SANDBOX_KEY:?run bootstrap}
      SSRF_PROXY_HTTP_URL: ''
      SSRF_PROXY_HTTPS_URL: ''
      HTTP_REQUEST_MAX_READ_TIMEOUT: '240'
      GUNICORN_TIMEOUT: '360'
      APP_MAX_EXECUTION_TIME: '600'
      ENABLE_EMAIL_PASSWORD_LOGIN: 'true'
      PLUGIN_DAEMON_URL: http://plugin-daemon:5002
      PLUGIN_DAEMON_KEY: ${PLUGIN_KEY:?run bootstrap}
      MODE: api
      MIGRATION_ENABLED: 'true'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    volumes:
    - dify-storage:/app/api/storage
    ports:
    - 127.0.0.1:18081:5001
  worker:
    image: langgenius/dify-api:1.9.2
    environment:
      SECRET_KEY: ${DIFY_SECRET_KEY:?run bootstrap}
      DB_USERNAME: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:?run bootstrap}
      DB_HOST: postgres
      DB_PORT: '5432'
      DB_DATABASE: dify
      REDIS_HOST: redis
      REDIS_PORT: '6379'
      REDIS_PASSWORD: ${REDIS_PASSWORD:?run bootstrap}
      CELERY_BROKER_URL: redis://:${REDIS_PASSWORD}@redis:6379/1
      CELERY_BACKEND: redis
      STORAGE_TYPE: opendal
      OPENDAL_SCHEME: fs
      OPENDAL_FS_ROOT: storage
      VECTOR_STORE: weaviate
      CHECK_UPDATE_URL: ''
      CONSOLE_WEB_URL: http://localhost:18080
      CONSOLE_API_URL: http://localhost:18080
      APP_WEB_URL: http://localhost:18080
      APP_API_URL: http://localhost:18080
      SERVICE_API_URL: http://localhost:18080
      FILES_URL: http://localhost:18080
      INTERNAL_FILES_URL: http://api:5001
      EDITION: SELF_HOSTED
      DEPLOY_ENV: PRODUCTION
      SERVER_WORKER_AMOUNT: '1'
      SERVER_WORKER_CONNECTIONS: '30'
      CELERY_WORKER_AMOUNT: '1'
      SQLALCHEMY_POOL_SIZE: '5'
      SQLALCHEMY_MAX_OVERFLOW: '5'
      LOG_LEVEL: INFO
      CODE_EXECUTION_ENDPOINT: http://sandbox:8194
      CODE_EXECUTION_API_KEY: ${SANDBOX_KEY:?run bootstrap}
      SSRF_PROXY_HTTP_URL: ''
      SSRF_PROXY_HTTPS_URL: ''
      HTTP_REQUEST_MAX_READ_TIMEOUT: '240'
      GUNICORN_TIMEOUT: '360'
      APP_MAX_EXECUTION_TIME: '600'
      ENABLE_EMAIL_PASSWORD_LOGIN: 'true'
      PLUGIN_DAEMON_URL: http://plugin-daemon:5002
      PLUGIN_DAEMON_KEY: ${PLUGIN_KEY:?run bootstrap}
      MODE: worker
      MIGRATION_ENABLED: 'false'
    depends_on:
    - api
    volumes:
    - dify-storage:/app/api/storage
  web:
    image: langgenius/dify-web:1.9.2
    environment:
      CONSOLE_API_URL: http://localhost:18080
      APP_API_URL: http://localhost:18080
      NEXT_TELEMETRY_DISABLED: '1'
      PM2_INSTANCES: '1'
  sandbox:
    image: langgenius/dify-sandbox:0.2.12
    environment:
      API_KEY: ${SANDBOX_KEY}
      GIN_MODE: release
      ENABLE_NETWORK: 'true'
  nginx:
    image: nginx:1.27-alpine
    ports:
    - 127.0.0.1:18080:80
    volumes:
    - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
    - api
    - web
  seekdb:
    image: quay.io/oceanbase/seekdb@sha256:4db4961869d554313520d6081fca29265ba6da6db7313311bd8acbed771a956b
    environment:
      ROOT_PASSWORD: ${SEEKDB_PASSWORD}
      MEMORY_LIMIT: 1G
    volumes:
    - museum-db:/var/lib/seekdb
  ollama:
    image: ollama/ollama:0.12.6
    volumes:
    - ollama-models:/root/.ollama
    environment:
      OLLAMA_NUM_PARALLEL: '1'
      OLLAMA_MAX_LOADED_MODELS: '1'
  museum:
    build: ./backend
    environment:
      MUSEUM_TOOL_TOKEN: ${MUSEUM_TOOL_TOKEN}
      SEEKDB_HOST: seekdb
      SEEKDB_PASSWORD: ${SEEKDB_PASSWORD}
      OLLAMA_MODEL: qwen3:1.7b
      DIFY_API_URL: http://api:5001
      DIFY_KEY_FILE: /runtime/app-key
    volumes:
    - ./data:/app/data:ro
    - ./runtime:/runtime:ro
    ports:
    - 127.0.0.1:18091:8091
    depends_on:
    - seekdb
    - ollama
volumes:
  postgres-data: {}
  redis-data: {}
  dify-storage: {}
  museum-db: {}
  ollama-models: {}
