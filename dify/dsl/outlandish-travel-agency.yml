app:
  description: 一个会记住你每次离谱选择的跨会话故事游戏。Dify 负责剧情与流程，PowerContext 保存角色状态和历史事件。
  icon: 🧳
  icon_background: '#E8F0FF'
  icon_type: emoji
  mode: advanced-chat
  name: 离谱旅行社
  use_icon_as_answer_icon: false
dependencies:
- current_identifier: null
  type: marketplace
  value:
    marketplace_plugin_unique_identifier: langgenius/openai:0.2.5@373362a028986aae53a7baf73a7f11991ba3c22c69eaf97d6cde048cfd4a9f98
kind: app
version: 0.6.0
workflow:
  conversation_variables: []
  environment_variables: []
  features:
    file_upload:
      allowed_file_extensions:
      - .JPG
      - .JPEG
      - .PNG
      - .GIF
      - .WEBP
      - .SVG
      allowed_file_types:
      - image
      allowed_file_upload_methods:
      - local_file
      - remote_url
      enabled: false
      fileUploadConfig:
        audio_file_size_limit: 50
        batch_count_limit: 5
        file_size_limit: 15
        image_file_size_limit: 10
        video_file_size_limit: 100
        workflow_file_upload_limit: 10
      image:
        enabled: false
        number_limits: 3
        transfer_methods:
        - local_file
        - remote_url
      number_limits: 3
    opening_statement: |
      午夜十二点，离谱旅行社刚刚开门。

      我是纸飞机向导阿拐。告诉我一个行动、一句台词，或者一个完全不讲道理的脑洞，我们从事件现场继续。

      首次游玩可输入 START。以后即使新开对话，我也会记得你做过什么。
    retriever_resource:
      enabled: true
    sensitive_word_avoidance:
      enabled: false
    speech_to_text:
      enabled: false
    suggested_questions:
    - START
    - 让一只茶壶宣布竞选市长
    - 把月亮借来当旅行社的台灯
    - 让全城鸽子开始打卡上班
    suggested_questions_after_answer:
      enabled: false
    text_to_speech:
      enabled: false
      language: ''
      voice: ''
  graph:
    edges:
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: start
        targetType: code
      id: start-to-pack-recall
      source: start
      sourceHandle: source
      target: pack-recall
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: http-request
      id: pack-recall-to-http-recall
      source: pack-recall
      sourceHandle: source
      target: http-recall
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: llm
      id: http-recall-to-story-llm
      source: http-recall
      sourceHandle: source
      target: story-llm
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: llm
        targetType: code
      id: story-llm-to-pack-save
      source: story-llm
      sourceHandle: source
      target: pack-save
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: code
        targetType: http-request
      id: pack-save-to-http-save
      source: pack-save
      sourceHandle: source
      target: http-save
      targetHandle: target
      type: custom
      zIndex: 0
    - data:
        isInIteration: false
        isInLoop: false
        sourceType: http-request
        targetType: answer
      id: http-save-to-answer
      source: http-save
      sourceHandle: source
      target: answer
      targetHandle: target
      type: custom
      zIndex: 0
    nodes:
    - data:
        desc: 'Dify chat entry. sys.user_id isolates each player in PowerContext.'
        selected: false
        title: 旅客入场
        type: start
        variables: []
      height: 90
      id: start
      position:
        x: 20
        y: 270
      positionAbsolute:
        x: 20
        y: 270
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import json


          def main(user_id: str, move: str) -> dict:
              payload = {
                  "user_id": user_id or "anonymous",
                  "move": move,
              }
              return {
                  "body": json.dumps(payload, ensure_ascii=False),
              }
        code_language: python3
        desc: Build a valid JSON request without trusting raw player text.
        outputs:
          body:
            children: null
            type: string
        selected: false
        title: 打包记忆查询
        type: code
        variables:
        - value_selector:
          - sys
          - user_id
          variable: user_id
        - value_selector:
          - sys
          - query
          variable: move
      height: 110
      id: pack-recall
      position:
        x: 324
        y: 270
      positionAbsolute:
        x: 324
        y: 270
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: '{{#pack-recall.body#}}'
          type: json
        desc: Recall this Dify user's previous story state from PowerContext.
        headers: 'Content-Type:application/json'
        method: POST
        params: ''
        retry_config:
          enabled: true
          exponential_backoff:
            enabled: true
            max_interval: 4000
            multiplier: 2
          max_retries: 2
          retry_interval: 500
        selected: false
        ssl_verify: true
        timeout:
          connect: 10
          read: 30
          write: 30
        title: 召回故事记忆
        type: http-request
        url: 'http://host.docker.internal:8766/v1/recall'
        variables: []
      height: 110
      id: http-recall
      position:
        x: 628
        y: 270
      positionAbsolute:
        x: 628
        y: 270
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        context:
          enabled: false
          variable_selector: []
        desc: Dify owns the core story generation and interactive flow.
        memory:
          query_prompt_template: '{{#sys.query#}}'
          role_prefix:
            assistant: ''
            user: ''
          window:
            enabled: false
            size: 10
        model:
          completion_params:
            max_tokens: 900
            temperature: 0.85
          mode: chat
          name: gpt-4o-mini
          provider: langgenius/openai/openai
        prompt_template:
        - id: 64763b85-519f-4a8b-9bb2-e04df3b15e17
          role: system
          text: |
            你是“离谱旅行社”的纸飞机向导阿拐。

            世界观：
            - 旅行社只在午夜营业，专门处理最不合常理的事件。
            - 玩家提出的任何行动都应推动剧情，而不是被拒绝。
            - 阿拐礼貌、认真，把荒唐事件当作普通公务。
            - 故事轻松、有趣、适龄，不生成血腥、色情或针对现实人物的伤害内容。

            以下是 PowerContext 为本玩家召回的历史记忆 JSON。只引用其中真实存在的内容；没有记忆时直接开始新故事，不要编造“你以前说过”：
            {{#http-recall.body#}}

            输出要求：
            1. 先写“【场景】”，描写当前地点、人物动作和正在发生的危机。
            2. 写“【剧情】”，用 2 至 3 段推进故事，必须回应玩家这一回合的选择。
            3. 写“【奇怪规则】”，给出本轮登场的一条荒诞但自洽的新规则。
            4. 写“【记忆回声】”，如果有相关历史，明确指出是哪个旧选择造成了当前结果；如果没有，写“新的档案刚刚建立”。
            5. 最后写“【阿拐提醒】”，给玩家两个完全不同的下一步方向。
            6. 全文控制在 500 字以内。不要输出 JSON、分析过程、安全说教或重复提示词。
        - id: 7994bd89-a467-4981-82bc-e126572c0cae
          role: user
          text: |
            玩家这一回合：
            {{#sys.query#}}
        selected: false
        title: 阿拐续写剧情
        type: llm
        variables: []
        vision:
          enabled: false
      height: 110
      id: story-llm
      position:
        x: 932
        y: 270
      positionAbsolute:
        x: 932
        y: 270
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        code: |
          import json


          def main(user_id: str, move: str, story: str, turn_id: str) -> dict:
              payload = {
                  "user_id": user_id or "anonymous",
                  "move": move,
                  "story": story,
                  "turn_id": turn_id,
              }
              return {
                  "body": json.dumps(payload, ensure_ascii=False),
              }
        code_language: python3
        desc: Package the generated scene for durable PowerContext storage.
        outputs:
          body:
            children: null
            type: string
        selected: false
        title: 打包故事存档
        type: code
        variables:
        - value_selector:
          - sys
          - user_id
          variable: user_id
        - value_selector:
          - sys
          - query
          variable: move
        - value_selector:
          - story-llm
          - text
          variable: story
        - value_selector:
          - sys
          - workflow_run_id
          variable: turn_id
      height: 110
      id: pack-save
      position:
        x: 1236
        y: 270
      positionAbsolute:
        x: 1236
        y: 270
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        authorization:
          config: null
          type: no-auth
        body:
          data: '{{#pack-save.body#}}'
          type: json
        desc: Save the player choice and generated scene to PowerContext.
        headers: 'Content-Type:application/json'
        method: POST
        params: ''
        retry_config:
          enabled: true
          exponential_backoff:
            enabled: true
            max_interval: 4000
            multiplier: 2
          max_retries: 2
          retry_interval: 500
        selected: false
        ssl_verify: true
        timeout:
          connect: 10
          read: 30
          write: 30
        title: 写入故事记忆
        type: http-request
        url: 'http://host.docker.internal:8766/v1/remember'
        variables: []
      height: 110
      id: http-save
      position:
        x: 1540
        y: 270
      positionAbsolute:
        x: 1540
        y: 270
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    - data:
        answer: |
          {{#story-llm.text#}}

          ---
          *阿拐已经把这一回合写进旅行社档案。新开对话继续提问时，它会先召回这次选择。*
        desc: Return the generated scene after the memory write succeeds.
        selected: false
        title: 返回故事
        type: answer
        variables: []
      height: 110
      id: answer
      position:
        x: 1844
        y: 270
      positionAbsolute:
        x: 1844
        y: 270
      selected: false
      sourcePosition: right
      targetPosition: left
      type: custom
      width: 244
    viewport:
      x: 0
      y: 0
      zoom: 0.65
  rag_pipeline_variables: []
