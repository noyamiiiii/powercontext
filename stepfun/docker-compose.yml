services:
  seekdb:
    image: oceanbase/seekdb:1.4.0
    ports:
      - "2881:2881"
    environment:
      CPU_COUNT: "2"
      MEMORY_LIMIT: 2G
      LOG_DISK_SIZE: 2G
      DATAFILE_SIZE: 2G
    volumes:
      - seekdb-data:/var/lib/oceanbase
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "bash -lc '</dev/tcp/127.0.0.1/2881' >/dev/null 2>&1 || exit 1",
        ]
      interval: 5s
      timeout: 3s
      retries: 30

volumes:
  seekdb-data:
